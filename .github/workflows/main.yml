name: wasm-pack
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  NODEM_ARCH: wasm-test      

jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
    - uses: jetli/wasm-pack-action@v0.4.0
      with:    
        version: 'latest'    
    - name: Build with wasm-pack
      run: wasm-pack build --target web --features=dom,vm,compile --debug --
