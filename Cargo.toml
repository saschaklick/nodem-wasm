[package]
name = "nodem-wasm"
version = "0.1.0"
authors = ["Sascha Klick <sascha.klick@toasternet.eu>"]
edition = "2021"
repository = "https://github.com/saschaklick/nodem-wasm"
desciption = "Implementation for the nodem-rs framework as a WASM library"
license = "MIT"

[features]
dom = ["nodem-rs/dom"]
vm = ["nodem-rs/vm", "virtmach"]
compile = ["nodem-rs/compile"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4.5"
wasm-bindgen = "0.2"
wasm-logger = { version = "0.2", max_level_debug = "info" }
js-sys = "0.3.77"
log = "0.4"
bytes = "1.10.1"
nostd = "0.1.6"
wasm-bindgen-futures = "0.4.50"
bitmap_writer = { version = "0.1.2" }
nodem-rs = { git = "https://github.com/saschaklick/nodem-rs", features = ["std", "base", "compile", "vm"] }
virtmach = { git = "https://github.com/saschaklick/virtmach-rs", features = ["i16", "random", "compile"], optional = true }


