[package]
name = "nodem-wasm"
version = "0.1.3"
authors = ["Sascha Klick <sascha.klick@toasternet.eu>"]
edition = "2021"
repository = "https://github.com/saschaklick/nodem-wasm"
description = "Implementation for the nodem-rs framework as a WASM library"
license = "MIT"

[features]
dom = ["nodem-rs/dom"]
vm = ["nodem-rs/vm", "virtmach"]
compile = ["nodem-rs/compile"]
# the device API interrupt "nodem" for programs, off by default
int_nodem = ["vm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4.5"
wasm-bindgen = "0.2"
wasm-logger = { version = "0.2", max_level_debug = "info" }
js-sys = "0.3.77"
log = "0.4"
bytes = "1.10.1"
nostd = "0.1.6"
wasm-bindgen-futures = "0.4.50"
bitmap_writer = { version = "0.1.2" }
nodem-rs = { git = "https://github.com/saschaklick/nodem-rs", features = ["std", "base", "compile", "vm"] }
virtmach = { git = "https://github.com/saschaklick/virtmach-rs", features = ["i16", "int_math_full", "compile", "basic"], optional = true }


# Size: opt-level z + fat LTO + one codegen unit take the wasm from ~1000 KB to ~630 KB, wasm-opt -Oz to ~600 KB
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(nodem_mode)"] }
